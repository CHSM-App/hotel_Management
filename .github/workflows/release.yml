name: Release apps

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: flutter_frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk hotel-manager-${{ github.ref_name }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: flutter_frontend/hotel-manager-${{ github.ref_name }}.apk

  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: flutter_frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip (exe needs its dlls/data folder)
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath hotel-manager-${{ github.ref_name }}-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: flutter_frontend/hotel-manager-${{ github.ref_name }}-windows.zip

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
