<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustration of a Konkan coastal lodge at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1c30"/>
      <stop offset="34%" stop-color="#1e3a5f"/>
      <stop offset="66%" stop-color="#6b4a63"/>
      <stop offset="86%" stop-color="#c9714f"/>
      <stop offset="100%" stop-color="#e8a765"/>
    </linearGradient>

    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d98d5a"/>
      <stop offset="14%" stop-color="#7a5570"/>
      <stop offset="46%" stop-color="#243f63"/>
      <stop offset="100%" stop-color="#12253c"/>
    </linearGradient>

    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2b3d"/>
      <stop offset="100%" stop-color="#0c1520"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd9a0" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#f2a463" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#f2a463" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glitter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffcf92" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#ffcf92" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="seaClip"><rect x="0" y="560" width="1600" height="230"/></clipPath>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="1000" fill="url(#sky)"/>

  <!-- A few high stars, fading out as the sky warms toward the horizon -->
  <g fill="#ffffff">
    <circle cx="180" cy="80" r="1.9" opacity="0.75"/>
    <circle cx="420" cy="140" r="1.4" opacity="0.5"/>
    <circle cx="700" cy="60" r="1.7" opacity="0.62"/>
    <circle cx="980" cy="128" r="1.3" opacity="0.42"/>
    <circle cx="1240" cy="72" r="1.9" opacity="0.68"/>
    <circle cx="1440" cy="170" r="1.4" opacity="0.38"/>
    <circle cx="300" cy="238" r="1.2" opacity="0.3"/>
    <circle cx="1120" cy="250" r="1.2" opacity="0.26"/>
  </g>

  <!-- Sun and its glow, sitting just above the waterline -->
  <circle cx="1120" cy="540" r="230" fill="url(#sunGlow)"/>
  <circle cx="1120" cy="548" r="52" fill="#ffd9a0" opacity="0.95"/>

  <!-- Distant headland — the Konkan coast is a run of rocky points -->
  <path d="M0 560 L0 512 C 74 500, 132 470, 214 476 C 288 481, 330 508, 402 512 C 452 515, 486 502, 534 508 L 560 560 Z"
        fill="#16283f" opacity="0.92"/>
  <path d="M1600 560 L1600 498 C 1528 486, 1478 462, 1400 470 C 1338 476, 1300 498, 1246 504 L 1214 560 Z"
        fill="#16283f" opacity="0.8"/>

  <!-- Sea -->
  <rect x="0" y="560" width="1600" height="230" fill="url(#sea)"/>

  <!-- Sun reflection: a broad soft column of light broken into irregular
       glints. Widths, offsets and opacities are deliberately uneven — evenly
       spaced, centred bars read as a lit staircase rather than moving water. -->
  <g clip-path="url(#seaClip)">
    <!-- Soft pool of light where the sun meets the water, then loose glints.
         No solid wedge: a filled triangle tapering to the sun reads as a lit
         jetty running out to sea, not a reflection. -->
    <ellipse cx="1120" cy="566" rx="118" ry="26" fill="#ffcf92" opacity="0.26"/>
    <ellipse cx="1120" cy="580" rx="74" ry="16" fill="#ffd9a0" opacity="0.2"/>
    <g fill="#ffcf92">
      <rect x="1092" y="572" width="52" height="2.5" rx="1.25" opacity="0.6"/>
      <rect x="1048" y="588" width="38" height="2.5" rx="1.25" opacity="0.3"/>
      <rect x="1128" y="594" width="58" height="2.5" rx="1.25" opacity="0.4"/>
      <rect x="1074" y="610" width="84" height="3" rx="1.5" opacity="0.36"/>
      <rect x="1174" y="622" width="30" height="3" rx="1.5" opacity="0.18"/>
      <rect x="1022" y="634" width="54" height="3" rx="1.5" opacity="0.2"/>
      <rect x="1104" y="648" width="96" height="3" rx="1.5" opacity="0.24"/>
      <rect x="978" y="662" width="40" height="3.5" rx="1.75" opacity="0.12"/>
      <rect x="1096" y="678" width="66" height="3.5" rx="1.75" opacity="0.2"/>
      <rect x="1208" y="694" width="42" height="3.5" rx="1.75" opacity="0.1"/>
      <rect x="1036" y="708" width="88" height="4" rx="2" opacity="0.15"/>
      <rect x="1148" y="730" width="54" height="4" rx="2" opacity="0.1"/>
      <rect x="962" y="746" width="70" height="4" rx="2" opacity="0.08"/>
      <rect x="1094" y="762" width="110" height="4" rx="2" opacity="0.08"/>
    </g>
    <!-- Wave lines catching the last light -->
    <g stroke="#8fa6bd" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M60 600 q 34 -8 68 0 t 68 0" opacity="0.2"/>
      <path d="M320 640 q 40 -9 80 0 t 80 0" opacity="0.17"/>
      <path d="M700 618 q 36 -8 72 0 t 72 0" opacity="0.14"/>
      <path d="M120 700 q 44 -10 88 0 t 88 0" opacity="0.14"/>
      <path d="M520 736 q 46 -10 92 0 t 92 0" opacity="0.12"/>
      <path d="M980 690 q 40 -9 80 0 t 80 0" opacity="0.1"/>
    </g>
  </g>

  <!-- Shoreline foam -->
  <path d="M0 782 q 120 -16 260 -4 t 268 6 q 150 10 300 -4 t 300 -8 q 260 -6 472 8 v 26 H0 Z"
        fill="#2a4055" opacity="0.55"/>

  <!-- Beach -->
  <path d="M0 792 q 200 -14 400 -2 t 420 4 q 220 6 440 -6 t 340 -4 V1000 H0 Z" fill="url(#sand)"/>

  <!-- The lodge: a simple two-storey block with warm lit windows -->
  <g>
    <path d="M196 792 H520 V612 L358 540 L196 612 Z" fill="#0e1a28"/>
    <path d="M358 528 L540 610 L520 626 L358 552 L196 626 L176 610 Z" fill="#132234"/>
    <rect x="196" y="700" width="324" height="92" fill="#0b1522"/>
    <g fill="#ffc477">
      <rect x="232" y="642" width="40" height="34" rx="4" opacity="0.9"/>
      <rect x="300" y="642" width="40" height="34" rx="4" opacity="0.55"/>
      <rect x="368" y="642" width="40" height="34" rx="4" opacity="0.88"/>
      <rect x="436" y="642" width="40" height="34" rx="4" opacity="0.42"/>
      <rect x="232" y="722" width="40" height="40" rx="4" opacity="0.6"/>
      <rect x="300" y="722" width="40" height="40" rx="4" opacity="0.92"/>
      <rect x="436" y="722" width="40" height="40" rx="4" opacity="0.72"/>
    </g>
    <!-- Doorway, lit from inside -->
    <path d="M368 792 v-56 a 20 20 0 0 1 40 0 v56 Z" fill="#ffc477" opacity="0.82"/>
    <!-- Veranda posts -->
    <g fill="#0b1522">
      <rect x="196" y="700" width="10" height="92"/>
      <rect x="510" y="700" width="10" height="92"/>
    </g>
  </g>

  <!-- Coconut palms -->
  <g fill="#0a131f">
    <!-- Left palm. Kept out at the edge on purpose: the sign-in card sits
         over the middle of this artboard, so anything near centre is hidden. -->
    <g transform="translate(-636 -18) scale(1.06)">
      <path d="M742 800 c -6 -70, -2 -140, 12 -206 l 15 3 c -14 66, -18 134, -12 203 Z"/>
      <g opacity="0.96">
        <path d="M757 592 c -46 -28, -96 -30, -138 -6 c 44 -6, 92 4, 132 22 Z"/>
        <path d="M757 592 c -30 -46, -78 -70, -126 -66 c 42 14, 82 42, 112 78 Z"/>
        <path d="M757 592 c 6 -52, 44 -94, 92 -108 c -38 30, -66 70, -76 116 Z"/>
        <path d="M757 592 c 44 -30, 100 -32, 146 -4 c -46 -8, -98 2, -138 22 Z"/>
        <path d="M757 592 c 20 -44, 16 -94, -12 -132 c 8 44, 6 92, -2 134 Z"/>
        <path d="M757 592 c 34 24, 58 62, 62 106 c -20 -40, -46 -74, -76 -96 Z"/>
      </g>
      <circle cx="750" cy="600" r="6" fill="#12202f"/>
      <circle cx="766" cy="604" r="5" fill="#12202f"/>
    </g>

    <!-- Right palm, shorter and leaning seaward -->
    <g>
      <path d="M1392 800 c 12 -62, 30 -122, 58 -176 l 14 6 c -28 54, -46 112, -58 172 Z"/>
      <g opacity="0.96">
        <path d="M1452 622 c -44 -22, -94 -18, -132 10 c 44 -12, 90 -8, 130 6 Z"/>
        <path d="M1452 622 c -22 -44, -66 -74, -114 -76 c 40 20, 74 50, 98 88 Z"/>
        <path d="M1452 622 c 14 -48, 56 -84, 106 -92 c -42 24, -74 60, -88 104 Z"/>
        <path d="M1452 622 c 46 -22, 100 -16, 142 16 c -46 -14, -96 -10, -134 6 Z"/>
        <path d="M1452 622 c 26 -40, 28 -90, 4 -130 c 4 44, -2 92, -16 132 Z"/>
      </g>
      <circle cx="1446" cy="630" r="5.5" fill="#12202f"/>
      <circle cx="1461" cy="633" r="5" fill="#12202f"/>
    </g>
  </g>

  <!-- Grounding shadow so the palms and lodge sit on the sand -->
  <ellipse cx="358" cy="794" rx="200" ry="12" fill="#060d15" opacity="0.5"/>
  <ellipse cx="161" cy="830" rx="54" ry="9" fill="#060d15" opacity="0.45"/>
  <ellipse cx="1398" cy="800" rx="46" ry="8" fill="#060d15" opacity="0.4"/>
</svg>
