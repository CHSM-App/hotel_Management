         numbers. Without it the order sheet's bottom padding resolves to 0 and
         "Place order" sits under the home indicator on a notched phone. -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Baloo+2:wght@800&display=swap"
      rel="stylesheet"
    />
    <title>Hotel Management System</title>
  </head>
