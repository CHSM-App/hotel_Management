<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real
         numbers. Without it the order sheet's bottom padding resolves to 0 and
         "Place order" sits under the home indicator on a notched phone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Baloo+2:wght@800&display=swap"
      rel="stylesheet"
    />
    <title>Hotel Management System</title>
    <style>
      /* Boot loader: shown by the HTML itself, before any JavaScript has arrived,
         so a slow connection never meets a blank page. main.jsx removes it once
         the app has drawn. Self-contained: no fonts or images to wait for. */
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: grid;
        place-items: center;
        background: #f6f5fb;
        color: #3b2a86;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity 0.35s ease;
      }
      #boot-loader.is-done { opacity: 0; pointer-events: none; }
      .boot-loader__box { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      .boot-loader__mark { position: relative; width: 84px; height: 84px; display: grid; place-items: center; }
      .boot-loader__mark svg.icon { width: 38px; height: 38px; }
      .boot-loader__logo { width: 62px; height: 62px; border-radius: 50%; object-fit: contain; background: #fff; padding: 5px; box-shadow: 0 4px 14px -4px rgba(59, 42, 134, 0.35); }
      .boot-loader__spin {
        position: absolute; inset: 0; width: 100%; height: 100%;
        animation: boot-spin 1.1s linear infinite;
      }
      .boot-loader__spin circle { fill: none; stroke-width: 3; stroke-linecap: round; }
      .boot-loader__spin .track { stroke: rgba(59, 42, 134, 0.14); }
      .boot-loader__spin .arc { stroke: #e0a92b; stroke-dasharray: 60 240; }
      .boot-loader__text { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #6b6880; }
      .boot-loader__text i { font-style: normal; animation: boot-dots 1.4s steps(4, end) infinite; display: inline-block; width: 1.2em; text-align: left; overflow: hidden; vertical-align: bottom; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-dots { 0% { width: 0; } 100% { width: 1.2em; } }
      @media (prefers-reduced-motion: reduce) {
        .boot-loader__spin { animation-duration: 3s; }
        .boot-loader__text i { animation: none; width: 1.2em; }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-live="polite" aria-label="Loading">
      <div class="boot-loader__box">
        <div class="boot-loader__mark">
          <svg class="boot-loader__spin" viewBox="0 0 84 84" aria-hidden="true">
            <circle class="track" cx="42" cy="42" r="38" />
            <circle class="arc" cx="42" cy="42" r="38" transform="rotate(-90 42 42)" />
          </svg>
          <svg class="icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="24" cy="26" r="11" />
            <circle cx="24" cy="26" r="6" />
            <path d="M6 10v10a3 3 0 0 0 3 3v15M9 10v9M12 10v10a3 3 0 0 1-3 3M42 10c-3 2-4 7-4 12h4v16" />
          </svg>
        </div>
        <div class="boot-loader__text">Loading<i>...</i></div>
      </div>
    </div>
    <script>
      /* Show the property's logo in the boot loader when this browser has seen one
         (saved by the dashboard as hm_logo); otherwise the plate-and-cutlery mark stays. */
      try {
        var logo = localStorage.getItem('hm_logo');
        if (logo) {
          var mark = document.querySelector('#boot-loader .icon');
          var img = new Image();
          img.onload = function () {
            img.className = 'boot-loader__logo';
            img.alt = '';
            if (mark) mark.replaceWith(img);
          };
          img.src = logo;
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
